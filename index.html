<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Nauleau — Vitrine Tracteurs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --teal: #009AA0;
    --teal-dark: #007478;
    --ink: #1c1c1c;
    --grey: #6b6f6e;
    --line: #e7e7e5;
    --bg-photo: #f2f2f0;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    width:100%; height:100%;
    background:#ffffff;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }

  .screen{
    position:relative;
    width:100vw; height:100vh;
    display:flex;
  }

  .qr-block{
    margin-top:2.2vh;
    flex-shrink:0;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:1.2vw;
  }
  .qr-block img{
    height:8vh; width:8vh;
    flex-shrink:0;
  }
  .qr-block span{
    font-family:'Inter'; font-weight:600; font-size:1.7vh;
    color:var(--ink);
    max-width:300px;
    text-align:left;
  }
  .qr-block span b{ color:var(--teal); }

  /* ---------- left: photo side ---------- */
  .visual{
    position:relative;
    flex:1.3;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-photo);
    overflow:hidden;
  }
  .photo{
    position:relative; z-index:1;
    width:100%; height:100%;
    object-fit:cover;
    transition:opacity .5s ease;
  }
  .machine-icon{
    position:relative; z-index:1;
    width:56%; max-width:520px;
  }
  .placeholder-tag{
    position:absolute; top:32px; left:32px; z-index:2;
    font-family:'Inter'; font-size:12px; letter-spacing:.02em;
    color:var(--grey); background:#ffffffcc; padding:6px 12px;
    border:1px solid var(--line); border-radius:4px;
  }
  .panel-logo{
    height:13vh; width:auto;
    margin-bottom:2.4vh;
    display:block;
  }

  .photo-dots{
    position:absolute; bottom:28px; left:0; right:0; z-index:2;
    display:flex; justify-content:center; gap:6px;
  }
  .photo-dot{
    width:7px; height:7px; border-radius:2px;
    background:#ffffffb0; border:1px solid #00000022;
  }
  .photo-dot.active{ background:var(--teal); }

  /* ---------- right: info panel ---------- */
  .panel{
    flex:1;
    background:#ffffff;
    display:flex; flex-direction:column;
    justify-content:center;
    padding:3vh 3.5vw;
    overflow:hidden;
  }

  .badge{
    display:inline-block;
    background:var(--teal);
    color:#ffffff;
    font-family:'Inter'; font-weight:700; font-size:1.3vh;
    padding:0.6vh 1.1vw;
    border-radius:5px;
    margin-bottom:1.6vh;
    width:fit-content;
    transition:opacity .4s ease, transform .4s ease;
  }

  .model{
    font-family:'Inter'; font-weight:800;
    font-size:clamp(24px, 4.6vh, 46px);
    line-height:1.15;
    color:var(--ink);
    margin-bottom:1.8vh;
    overflow-wrap:break-word;
    word-break:break-word;
    transition:opacity .4s ease, transform .4s ease;
  }

  .specs{
    display:flex; flex-direction:column; gap:0.7vh;
    margin-bottom:2vh;
    transition:opacity .4s ease, transform .4s ease;
  }
  .spec-row{
    display:flex; gap:10px; font-size:2.3vh;
  }
  .spec-row .lbl{ color:var(--grey); }
  .spec-row .val{ color:var(--ink); font-weight:500; }

  .price{
    font-family:'Inter'; font-weight:800;
    font-size:clamp(28px, 5.4vh, 54px);
    color:var(--teal);
    transition:opacity .4s ease, transform .4s ease;
  }

  .char-heading{
    font-family:'Inter'; font-weight:700; font-size:1.9vh;
    letter-spacing:.04em; text-transform:uppercase;
    color:var(--teal);
    margin:1.8vh 0 1.5vh 0;
    padding-top:1.8vh;
    border-top:1px solid var(--line);
  }
  .char-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:2.4vw; row-gap:1.15vh;
  }
  .char-row{ font-size:2vh; display:flex; gap:6px; }
  .char-row .lbl{ color:var(--grey); }
  .char-row .val{ color:var(--ink); font-weight:600; }

  .info-view{ display:none; }

  .info-fullscreen{
    display:none;
    position:absolute; inset:0; z-index:20;
    width:100%; height:100%;
    object-fit:contain;
    background:#000000;
  }
  .info-message{
    font-family:'Inter'; font-weight:400; font-size:20px; line-height:1.6;
    color:var(--ink); max-width:480px;
    transition:opacity .4s ease, transform .4s ease;
  }

  .fade-out .badge, .fade-out .model, .fade-out .specs, .fade-out .price,
  .fade-out .info-message{
    opacity:0; transform:translateY(8px);
  }
  .badge, .model, .specs, .price, .info-message{
    transition:opacity .4s ease, transform .4s ease;
  }
</style>
</head>

<script>
const SLIDE_SPACING = 15;

const fallbackTractors = [
  { brand:"FENDT", model:"FENDT 311 PROFI", power:"115 ch", hours:"4 200 h", price:"39 500,00 € HT", image:null,
    characteristics:{ "Marque":"FENDT", "Modèle":"311 PROFI", "État":"Occasion - Bon état", "Année":"2019", "Heures":"4 200 h", "Puissance":"115 ch", "Roues motrices":"4 rm", "Référence":"6073" } },
  { brand:"JOHN DEERE", model:"JOHN DEERE 6155R", power:"155 ch", hours:"3 750 h", price:"79 000,00 € HT", image:null,
    characteristics:{ "Marque":"JOHN DEERE", "Modèle":"6155R", "État":"Occasion - Bon état", "Année":"2020", "Heures":"3 750 h", "Puissance":"155 ch", "Roues motrices":"4 rm", "Boîte de vitesses":"VARIATION CONTINUE", "Référence":"6210" } },
];

let slides = fallbackTractors.map(t => ({ type: 'tractor', data: t }));
let index = 0;

const photoEl = document.getElementById('photo');
const iconEl = document.getElementById('icon');
const noPhotoTag = document.getElementById('no-photo-tag');
const tractorView = document.getElementById('tractor-view');
const infoView = document.getElementById('info-view');
const modelEl = document.getElementById('model');
const powerEl = document.getElementById('power');
const hoursEl = document.getElementById('hours');
const priceEl = document.getElementById('price');
const referenceEl = document.getElementById('reference');
const refRow = document.getElementById('ref-row');
const charGrid = document.getElementById('char-grid');
const infoTitleEl = document.getElementById('info-title');
const infoMessageEl = document.getElementById('info-message');
const infoFullscreen = document.getElementById('info-fullscreen');
const panel = document.getElementById('panel');
const dotsEl = document.getElementById('photo-dots');

function buildDots(){
  dotsEl.innerHTML = '';
  slides.forEach(() => {
    const d = document.createElement('div');
    d.className = 'photo-dot';
    dotsEl.appendChild(d);
  });
}

function updateDots(){
  const dots = dotsEl.children;
  for(let i=0;i<dots.length;i++){
    dots[i].className = 'photo-dot' + (i===index ? ' active' : '');
  }
}

function buildSlides(tractorsArr, infosArr){
  const activeInfos = (infosArr || []).filter(i => i.active);
  const tractorSlides = tractorsArr.map(t => ({ type: 'tractor', data: t }));

  if (activeInfos.length === 0) return tractorSlides;

  const result = [];
  let infoIdx = 0;
  tractorSlides.forEach((slide, i) => {
    result.push(slide);
    if ((i + 1) % SLIDE_SPACING === 0) {
      result.push({ type: 'info', data: activeInfos[infoIdx % activeInfos.length] });
      infoIdx++;
    }
  });
  if (result.filter(s => s.type === 'info').length === 0) {
    activeInfos.forEach(info => result.push({ type: 'info', data: info }));
  }
  return result;
}

function render(){
  const slide = slides[index];

  if (slide.type === 'info' && slide.data.image) {
    // Affiche plein écran : on masque tout le reste (photo, panneau texte)
    infoFullscreen.src = slide.data.image;
    infoFullscreen.style.display = 'block';
    tractorView.style.display = 'none';
    infoView.style.display = 'none';
    photoEl.style.display = 'none';
    iconEl.style.display = 'none';
    noPhotoTag.style.display = 'none';
  } else if (slide.type === 'info') {
    infoFullscreen.style.display = 'none';
    tractorView.style.display = 'none';
    infoView.style.display = 'block';
    infoTitleEl.textContent = slide.data.title || '';
    infoMessageEl.textContent = slide.data.message || '';

    photoEl.style.display = 'none';
    iconEl.style.display = 'none';
    noPhotoTag.style.display = 'none';
  } else {
    infoFullscreen.style.display = 'none';
    const t = slide.data;
    tractorView.style.display = 'block';
    infoView.style.display = 'none';

    modelEl.textContent = t.model || 'Tracteur disponible';
    powerEl.textContent = t.power || '—';
    hoursEl.textContent = t.hours || '—';
    priceEl.textContent = t.price || 'Nous consulter';

    const reference = t.characteristics && t.characteristics['Référence'];
    if (reference) {
      referenceEl.textContent = reference;
      refRow.style.display = 'flex';
    } else {
      refRow.style.display = 'none';
    }

    charGrid.innerHTML = '';
    const chars = t.characteristics || {};
    const MAX_CHAR_ROWS = 8; // garantit que tout tient sur l'écran, quel que soit le tracteur
    let shown = 0;
    Object.keys(chars).forEach(label => {
      if (label === 'Référence') return; // déjà affichée en haut
      if (shown >= MAX_CHAR_ROWS) return;
      const row = document.createElement('div');
      row.className = 'char-row';
      row.innerHTML = `<span class="lbl">${label} :</span><span class="val">${chars[label]}</span>`;
      charGrid.appendChild(row);
      shown++;
    });

    if (t.image) {
      photoEl.src = t.image;
      photoEl.style.display = 'block';
      iconEl.style.display = 'none';
      noPhotoTag.style.display = 'none';
    } else {
      photoEl.style.display = 'none';
      iconEl.style.display = 'block';
      noPhotoTag.style.display = 'block';
    }
  }

  updateDots();
}

function next(){
  panel.classList.add('fade-out');
  setTimeout(() => {
    index = (index + 1) % slides.length;
    render();
    panel.classList.remove('fade-out');
  }, 400);
}

async function loadData(){
  let tractorsData = null;
  let infosData = null;

  try {
    const res = await fetch('data/tracteurs.json', { cache: 'no-store' });
    const data = await res.json();
    if (data.tractors && data.tractors.length > 0) tractorsData = data.tractors;
  } catch (err) {
    console.warn('Impossible de charger data/tracteurs.json, affichage des exemples.', err);
  }

  try {
    const res = await fetch('data/infos.json', { cache: 'no-store' });
    infosData = await res.json();
  } catch (err) {
    // pas grave si le fichier n'existe pas encore
  }

  if (tractorsData) {
    slides = buildSlides(tractorsData, infosData);
    index = 0;
    buildDots();
    render();
  }
}

buildDots();
render();
setInterval(next, 14000);

loadData();
setInterval(loadData, 10 * 60 * 1000);
</script>
