<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nauleau — Vitrine Tracteurs</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --teal:#009AA0;
  --ink:#1c1c1c;
  --grey:#717574;
  --line:#e5e6e5;
  --bg-photo:#f1f1ef;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  background:#fff;
  color:var(--ink);
  font-family:'Inter',Arial,sans-serif;
  overflow:hidden;
}

.screen{
  position:relative;
  width:100vw;
  height:100vh;
  display:grid;
  grid-template-columns:52% 48%;
  background:#fff;
}

/* GAUCHE : photo + informations principales */
.left-zone{
  height:100vh;
  min-width:0;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--line);
  overflow:hidden;
}

.visual{
  position:relative;
  flex:0 0 65%;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg-photo);
  overflow:hidden;
}

.photo{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:opacity .5s ease;
}

.machine-icon{
  position:relative;
  z-index:1;
  width:50%;
  max-width:480px;
}

.placeholder-tag{
  position:absolute;
  top:3vh;
  left:2vw;
  z-index:2;
  font-size:1.6vh;
  color:var(--grey);
  background:#ffffffd9;
  padding:.7vh .8vw;
  border:1px solid var(--line);
  border-radius:4px;
}

.photo-dots{
  position:absolute;
  left:0;
  right:0;
  bottom:1.6vh;
  z-index:2;
  display:flex;
  justify-content:center;
  gap:6px;
}
.photo-dot{
  width:7px;
  height:7px;
  border-radius:2px;
  background:#ffffffb0;
  border:1px solid #00000022;
}
.photo-dot.active{background:var(--teal)}

.left-summary{
  flex:1 1 auto;
  min-height:0;
  padding:4.1vh 2.5vw 2.5vh 2.5vw;
  background:#fff;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  overflow:hidden;
}

.left-summary .model{
  margin:0 0 1.8vh 0;
  font-size:clamp(28px,4.1vh,52px);
  line-height:1.06;
  font-weight:800;
  overflow-wrap:anywhere;
}

.main-specs{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:.8vh 1.8vw;
  margin-bottom:1.8vh;
}

.spec-row{
  display:flex;
  gap:.45vw;
  font-size:clamp(22px,3.2vh,40px);
  line-height:1.05;
  white-space:nowrap;
}
.spec-row .lbl{color:var(--grey)}
.spec-row .val{color:var(--ink);font-weight:700}

.price{
  color:var(--teal);
  font-size:clamp(38px,6.0vh,76px);
  line-height:1;
  font-weight:800;
}

/* DROITE : logo + caractéristiques verticales + QR */
.panel{
  height:100vh;
  min-width:0;
  padding:3.2vh 2.3vw 2.6vh 2.3vw;
  background:#fff;
  overflow:hidden;
}

.tractor-view{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.right-logo{
  flex:0 0 auto;
  padding-bottom:1.5vh;
  border-bottom:1px solid var(--line);
}

.panel-logo{
  display:block;
  width:auto;
  max-width:100%;
  height:9.5vh;
  object-fit:contain;
  object-position:left center;
  margin:0 0 .7vh 0;
}

.badge{
  display:inline-block;
  width:fit-content;
  background:var(--teal);
  color:#fff;
  font-weight:700;
  font-size:1.55vh;
  padding:.55vh .8vw;
  border-radius:5px;
}

.char-heading{
  flex:0 0 auto;
  margin:2.0vh 0 1.5vh 0;
  color:var(--teal);
  font-weight:700;
  font-size:3.0vh;
  line-height:1;
  letter-spacing:.02em;
  text-transform:uppercase;
}

.char-grid{
  --char-font:4.15vh;
  --char-gap:1.05vh;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  gap:var(--char-gap);
  overflow:hidden;
}

.char-row{
  display:flex;
  align-items:baseline;
  gap:.55vw;
  min-width:0;
  font-size:var(--char-font);
  line-height:1.06;
}

.char-row .lbl{
  flex:0 0 auto;
  color:var(--grey);
  font-weight:400;
}

.char-row .val{
  min-width:0;
  color:var(--ink);
  font-weight:700;
  overflow-wrap:anywhere;
}

.qr-block{
  flex:0 0 auto;
  width:100%;
  margin-top:1.8vh;
  padding-top:1.8vh;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:1vw;
}

.qr-block img{
  width:7.5vh;
  height:7.5vh;
  flex-shrink:0;
}

.qr-block span{
  max-width:none;
  color:var(--ink);
  font-size:1.8vh;
  line-height:1.2;
  font-weight:500;
  text-align:left;
}

.qr-block span b{
  color:var(--teal);
  font-weight:700;
}

/* Diapositives d'information : comportement conservé */
.info-view{
  width:100%;
  height:100%;
  display:none;
  flex-direction:column;
  justify-content:center;
}

.info-view .model{
  font-size:clamp(28px,4.6vh,54px);
  font-weight:800;
  margin:2vh 0;
}

.info-message{
  font-size:2.5vh;
  line-height:1.5;
  color:var(--ink);
}

.info-fullscreen{
  display:none;
  position:absolute;
  inset:0;
  z-index:20;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.fade-out .badge,
.fade-out .char-heading,
.fade-out .char-grid,
.fade-out .qr-block,
.fade-out .info-message{
  opacity:0;
  transform:translateY(8px);
}

.badge,.char-heading,.char-grid,.qr-block,.info-message{
  transition:opacity .4s ease,transform .4s ease;
}

</style>
</head>

<script>
const SLIDE_SPACING = 15;

const fallbackTractors = [
  { brand:"FENDT", model:"FENDT 311 PROFI", power:"115 ch", hours:"4 200 h", price:"39 500,00 € HT", image:null,
    characteristics:{ "Marque":"FENDT", "Modèle":"311 PROFI", "État":"Occasion - Bon état", "Année":"2019", "Heures":"4 200 h", "Puissance":"115 ch", "Roues motrices":"4 rm", "Référence":"6073" } },
  { brand:"JOHN DEERE", model:"JOHN DEERE 6155R", power:"155 ch", hours:"3 750 h", price:"79 000,00 € HT", image:null,
    characteristics:{ "Marque":"JOHN DEERE", "Modèle":"6155R", "État":"Occasion - Bon état", "Année":"2020", "Heures":"3 750 h", "Puissance":"155 ch", "Roues motrices":"4 rm", "Boîte de vitesses":"VARIATION CONTINUE", "Référence":"6210" } },
];

let slides = fallbackTractors.map(t => ({ type: 'tractor', data: t }));
let index = 0;

const photoEl = document.getElementById('photo');
const iconEl = document.getElementById('icon');
const noPhotoTag = document.getElementById('no-photo-tag');
const tractorView = document.getElementById('tractor-view');
const leftSummary = document.getElementById('left-summary');
const infoView = document.getElementById('info-view');
const modelEl = document.getElementById('model');
const powerEl = document.getElementById('power');
const hoursEl = document.getElementById('hours');
const priceEl = document.getElementById('price');
const charGrid = document.getElementById('char-grid');
const infoTitleEl = document.getElementById('info-title');
const infoMessageEl = document.getElementById('info-message');
const infoFullscreen = document.getElementById('info-fullscreen');
const panel = document.getElementById('panel');
const dotsEl = document.getElementById('photo-dots');


function fitCharacteristics(){
  let font = 4.15;   // taille cible : très lisible de loin
  let gap = 1.05;
  const minFont = 2.75;

  charGrid.style.setProperty('--char-font', font + 'vh');
  charGrid.style.setProperty('--char-gap', gap + 'vh');

  let guard = 0;
  while (charGrid.scrollHeight > charGrid.clientHeight + 2 && font > minFont && guard < 30) {
    font -= 0.10;
    if (font < 3.35) gap = 0.70;
    charGrid.style.setProperty('--char-font', font.toFixed(2) + 'vh');
    charGrid.style.setProperty('--char-gap', gap + 'vh');
    guard++;
  }
}

function buildDots(){
  dotsEl.innerHTML = '';
  slides.forEach(() => {
    const d = document.createElement('div');
    d.className = 'photo-dot';
    dotsEl.appendChild(d);
  });
}

function updateDots(){
  const dots = dotsEl.children;
  for(let i=0;i<dots.length;i++){
    dots[i].className = 'photo-dot' + (i===index ? ' active' : '');
  }
}

function buildSlides(tractorsArr, infosArr){
  const activeInfos = (infosArr || []).filter(i => i.active);
  const tractorSlides = tractorsArr.map(t => ({ type: 'tractor', data: t }));

  if (activeInfos.length === 0) return tractorSlides;

  const result = [];
  let infoIdx = 0;
  tractorSlides.forEach((slide, i) => {
    result.push(slide);
    if ((i + 1) % SLIDE_SPACING === 0) {
      result.push({ type: 'info', data: activeInfos[infoIdx % activeInfos.length] });
      infoIdx++;
    }
  });
  if (result.filter(s => s.type === 'info').length === 0) {
    activeInfos.forEach(info => result.push({ type: 'info', data: info }));
  }
  return result;
}

function render(){
  const slide = slides[index];

  if (slide.type === 'info' && slide.data.image) {
    // Affiche plein écran : on masque tout le reste (photo, panneau texte)
    infoFullscreen.src = slide.data.image;
    infoFullscreen.style.display = 'block';
    tractorView.style.display = 'none';
    leftSummary.style.visibility = 'hidden';
    infoView.style.display = 'none';
    photoEl.style.display = 'none';
    iconEl.style.display = 'none';
    noPhotoTag.style.display = 'none';
  } else if (slide.type === 'info') {
    infoFullscreen.style.display = 'none';
    tractorView.style.display = 'none';
    leftSummary.style.visibility = 'hidden';
    infoView.style.display = 'flex';
    infoTitleEl.textContent = slide.data.title || '';
    infoMessageEl.textContent = slide.data.message || '';

    photoEl.style.display = 'none';
    iconEl.style.display = 'none';
    noPhotoTag.style.display = 'none';
  } else {
    infoFullscreen.style.display = 'none';
    const t = slide.data;
    tractorView.style.display = 'flex';
    leftSummary.style.visibility = 'visible';
    infoView.style.display = 'none';

    modelEl.textContent = t.model || 'Tracteur disponible';
    powerEl.textContent = t.power || '—';
    hoursEl.textContent = t.hours || '—';
    priceEl.textContent = t.price || 'Nous consulter';

    charGrid.innerHTML = '';
    const chars = t.characteristics || {};
    Object.keys(chars).forEach(label => {
      if (label === 'Puissance' || label === 'Heures') return; // déjà affichées sous la photo
      const row = document.createElement('div');
      row.className = 'char-row';
      row.innerHTML = `<span class="lbl">${label} :</span><span class="val">${chars[label]}</span>`;
      charGrid.appendChild(row);
    });

    // Commence très gros, puis réduit seulement si nécessaire pour que tout tienne.
    requestAnimationFrame(fitCharacteristics);

    if (t.image) {
      photoEl.src = t.image;
      photoEl.style.display = 'block';
      iconEl.style.display = 'none';
      noPhotoTag.style.display = 'none';
    } else {
      photoEl.style.display = 'none';
      iconEl.style.display = 'block';
      noPhotoTag.style.display = 'block';
    }
  }

  updateDots();
}

function next(){
  panel.classList.add('fade-out');
  setTimeout(() => {
    index = (index + 1) % slides.length;
    render();
    panel.classList.remove('fade-out');
  }, 400);
}

let lastTractorsUpdatedAt = null;

async function loadData(){
  let tractorsData = null;
  let infosData = null;
  let newUpdatedAt = null;

  try {
    const res = await fetch('data/tracteurs.json', { cache: 'no-store' });
    const data = await res.json();
    if (data.tractors && data.tractors.length > 0) {
      tractorsData = data.tractors;
      newUpdatedAt = data.updated_at || null;
    }
  } catch (err) {
    console.warn('Impossible de charger data/tracteurs.json, affichage des exemples.', err);
  }

  try {
    const res = await fetch('data/infos.json', { cache: 'no-store' });
    infosData = await res.json();
  } catch (err) {
    // pas grave si le fichier n'existe pas encore
  }

  if (tractorsData) {
    // On ne repart du premier tracteur que si le robot a vraiment rapporté
    // une nouvelle liste (toutes les ~6h). Sinon (simple vérification des
    // messages/affiches toutes les 10 min), on garde la position actuelle
    // pour ne pas interrompre le défilement en cours.
    const isNewTractorData = newUpdatedAt !== lastTractorsUpdatedAt;
    slides = buildSlides(tractorsData, infosData);
    if (isNewTractorData) {
      index = 0;
      lastTractorsUpdatedAt = newUpdatedAt;
    } else {
      index = Math.min(index, slides.length - 1);
    }
    buildDots();
    render();
  }
}

buildDots();
render();
setInterval(next, 14000);

loadData();
setInterval(loadData, 10 * 60 * 1000);
</script>
