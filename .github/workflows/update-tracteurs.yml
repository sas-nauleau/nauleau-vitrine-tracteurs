name: Mise à jour des tracteurs

on:
  schedule:
    # Toutes les 6 heures (heures UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # permet aussi de le lancer manuellement depuis GitHub

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le scraper
        run: python scraper.py

      - name: Enregistrer les changements
        run: |
          git config user.name "nauleau-vitrine-bot"
          git config user.email "action@github.com"
          git add data/tracteurs.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique des tracteurs"
          git push
