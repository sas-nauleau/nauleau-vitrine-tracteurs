name: Mise à jour des annonces (tracteurs et matériels)

on:
  schedule:
    # Une seule fois par nuit : 02h17 UTC = 03h17 (hiver) / 04h17 (été) en France
    - cron: "17 2 * * *"
  workflow_dispatch:  # lancement manuel (bouton "Actualiser maintenant" de l'admin, ou depuis GitHub)
    inputs:
      full:
        description: "Relire TOUTES les fiches (mode complet, plus lourd pour le site)"
        type: boolean
        default: false

# Jamais deux robots en même temps
concurrency:
  group: robot-annonces
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le robot
        env:
          SUPABASE_URL: https://dttkknzcsenlccbcnpkp.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FULL_REFRESH: ${{ inputs.full && '1' || '' }}
        run: python scraper.py

      - name: Enregistrer les changements
        if: always()
        run: |
          git config user.name "nauleau-vitrine-bot"
          git config user.email "action@github.com"
          git add data/tracteurs.json data/annonces.json data/rapport-robot.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique des annonces"
          git pull --rebase --autostash || true
          git push
